# ═══════════════════════════════════════════════════════════════════════════
# Valley View University — nginx security rules (drop-in snippet)
#
# This file contains ONLY hardening rules. It has no server_name, no root, no
# TLS settings and no PHP handler, so it cannot conflict with or override the
# working configuration you already have. It is meant to be included INSIDE
# your existing `server { ... }` block for alpha.vvu.edu.gh:
#
#     server {
#         server_name alpha.vvu.edu.gh;
#         root /home/valley_view_uni;
#         ...your existing settings...
#
#         include /etc/nginx/snippets/vvu-security.conf;   # <── add this line
#
#         ...your existing location blocks...
#     }
#
# Every directory rule below uses "^~", which in nginx beats regular-expression
# locations REGARDLESS of the order they appear in the file. That is deliberate:
# it means this snippet is safe to include anywhere inside the server block,
# and a request for /dev-tools/check_db.php can never fall through to your
# `location ~ \.php$` handler and get executed.
#
# Addresses pentest findings 2, 4 and 7.
# ═══════════════════════════════════════════════════════════════════════════


# ── Finding 7: security headers ────────────────────────────────────────────
# "always" makes these apply to error responses (404/500) too.
#
# NOTE: nginx does not merge add_header across levels. If any of your existing
# location blocks has its own add_header, these five are dropped inside that
# location and must be repeated there.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy is intentionally NOT set here. It is sent by
# includes/security_headers.php, which knows the exact CDN origins the site
# uses. Setting it in both places gives the browser two policies, and it
# enforces the intersection of them — which breaks pages.

# Don't advertise the nginx version number in headers or error pages.
server_tokens off;


# ── Finding 2: the .git directory ──────────────────────────────────────────
# This is the rule that actually closes Finding 2 on your server. .htaccess is
# ignored by nginx, so nothing in the PHP codebase can do this.
#
# Your deploys are `git pull`, so .git has to stay on disk — it just must never
# be readable over HTTP.
location ^~ /.git {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Every other dotfile (.env, .htaccess, .user.ini, .gitignore ...), except the
# Let's Encrypt challenge directory, which must stay reachable for renewals.
location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}


# ── Directories that must never be served ──────────────────────────────────
# dev-tools/ holds 65 one-off scripts that run unauthenticated SQL (including
# one that called phpinfo()). tools/ holds the CLI admin-password tool.
# includes/ holds config.php — your database password.
location ^~ /dev-tools/  { deny all; return 404; }
location ^~ /tools/      { deny all; return 404; }
location ^~ /includes/   { deny all; return 404; }
location ^~ /engagement/ { deny all; return 404; }
location ^~ /.qoder/     { deny all; return 404; }


# ── Uploads must never execute ─────────────────────────────────────────────
# Last line of defence if a malicious file ever gets past the type checks in
# includes/upload_helper.php. The nested regex wins inside this prefix block.
location ^~ /uploads/ {
    location ~* \.(php|php\d|phtml|phar|pl|py|cgi|sh|asp|aspx|jsp)$ {
        deny all;
        return 404;
    }

    # All five headers are repeated here, not just nosniff. Setting even one
    # add_header inside a location makes nginx discard every inherited one —
    # the same trap described at the top of this file.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    try_files $uri =404;
}


# ── Source, schema and backup files ────────────────────────────────────────
# .json is deliberately absent — js/ fetches data/courses.json at runtime.
location ~* \.(sql|md|log|ini|bak|orig|swp|dist|example|yml|yaml)$ {
    deny all;
    return 404;
}

# Root-level notes like SYSTEM_OVERVIEW.txt and QUICK_START.txt leak internals.
# robots.txt is the one legitimate exception, so it is declared first as an
# exact match (=), which outranks every regex location.
location = /robots.txt {
    allow all;
    access_log off;
}
location ~* ^/[^/]+\.txt$ {
    deny all;
    return 404;
}


# ── Finding 4: phpMyAdmin ──────────────────────────────────────────────────
# Blocking it is not the same as removing it — still uninstall it from the host
# (Part B step 6). This stops it being reachable in the meantime.
location ~ ^/(phpmyadmin|pma|myadmin|adminer|dbadmin)(/|$) {
    deny all;
    return 404;
}
