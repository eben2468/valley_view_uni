# ═══════════════════════════════════════════════════════════════════════════
# alpha.vvu.edu.gh — ready-to-install replacement for
# /etc/nginx/sites-available/valley_view_uni
#
# Tailored to dspace-srv as it actually is:
#   root            /home/valley_view_uni
#   PHP             /run/php/php8.3-fpm.sock
#   certificates    Certbot, paths preserved verbatim from the existing file
#
# This does NOT touch the `dspace` or `default` server blocks.
#
# Why replace rather than patch: the existing file contains the whole
# configuration TWICE (two identical 443 blocks and two identical 80 blocks for
# the same server_name). nginx keeps the first and logs
# "conflicting server name ... ignored" for the rest, so the duplicates are
# dead weight that makes every future edit ambiguous — you would never be sure
# which copy is live.
# ═══════════════════════════════════════════════════════════════════════════

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;                                                  # managed by Certbot
    listen [::]:443 ssl;
    server_name alpha.vvu.edu.gh;

    root /home/valley_view_uni;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/alpha.vvu.edu.gh/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alpha.vvu.edu.gh/privkey.pem;     # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                            # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                              # managed by Certbot

    # Matches post_max_size in .user.ini. Without this, nginx rejects large
    # admin image uploads with "413 Request Entity Too Large" before PHP ever
    # sees them — the problem UPLOAD_LIMITS.md describes.
    client_max_body_size 72M;

    # ── All security hardening lives in this one include ───────────────────
    # Security headers, .git denial, dev-tools/tools/includes denial, the
    # uploads no-execute rule, and the phpMyAdmin block. Keeping it in a
    # separate file means `git pull` updates your hardening.
    include /etc/nginx/snippets/vvu-security.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # No try_files here on purpose. Debian/Ubuntu's fastcgi-php.conf
        # already ends with `try_files $fastcgi_script_name =404;`, and a
        # second try_files in the same block is a hard config error:
        #   "try_files" directive is duplicate in snippets/fastcgi-php.conf:5
        # Its version is also the better one — it checks the script path after
        # PATH_INFO has been split off, which is what stops a crafted
        # /uploads/photo.jpg/x.php from reaching the interpreter.
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
}

# ── HTTP → HTTPS ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name alpha.vvu.edu.gh;

    # Certbot's HTTP-01 challenge follows redirects, so renewals keep working.
    return 301 https://$host$request_uri;
}
