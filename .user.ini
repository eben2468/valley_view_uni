; PHP upload limits for Valley View University
;
; Works on hosts running PHP as FastCGI/PHP-FPM (most shared hosting, cPanel).
; If your host runs PHP as an Apache module instead, the matching directives in
; .htaccess apply. Both are safe to have present at the same time.
;
; NOTE: these do NOT fix a "413 Request Entity Too Large" error on nginx —
; that limit lives in the nginx config (client_max_body_size) and must be
; raised by the host. See UPLOAD_LIMITS.md.

upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20
