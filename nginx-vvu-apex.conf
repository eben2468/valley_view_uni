# ═══════════════════════════════════════════════════════════════════════════
# vvu.edu.gh — STEP 2 OF 2: the live configuration.
#
# Install this only AFTER `certbot certonly` has successfully issued a
# certificate covering both vvu.edu.gh and www.vvu.edu.gh. Installing it first
# stops nginx from starting, because the certificate paths below will not exist.
#
#     cp nginx-vvu-apex.conf /etc/nginx/sites-available/valley_view_uni
#     nginx -t && systemctl reload nginx
#
# Layout:
#   vvu.edu.gh         :443  → serves the site
#   www.vvu.edu.gh     :443  → 301 to vvu.edu.gh
#   both               :80   → 301 to https://vvu.edu.gh
#
# alpha.vvu.edu.gh is deliberately absent — it is being retired. See the note
# at the bottom of this file for how to finish decommissioning it.
# ═══════════════════════════════════════════════════════════════════════════


# ── The site ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vvu.edu.gh;

    root /home/valley_view_uni;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/vvu.edu.gh/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vvu.edu.gh/privkey.pem;     # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                      # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                        # managed by Certbot

    # Matches post_max_size in .user.ini, so large admin image uploads are not
    # rejected by nginx before PHP ever sees them.
    client_max_body_size 72M;

    # Security headers, .git denial, dev-tools/tools/includes denial, the
    # uploads no-execute rule and the phpMyAdmin block.
    include /etc/nginx/snippets/vvu-security.conf;

    # Server-local rules kept out of git (the renamed phpMyAdmin path).
    # Wildcard include: matches nothing without error if the file is absent.
    include /etc/nginx/snippets/vvu-local*.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # No try_files here: Debian's fastcgi-php.conf already declares one,
        # and a second in the same block is a fatal config error.
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
}


# ── www → bare domain ──────────────────────────────────────────────────────
# A separate server block rather than adding www to the one above, so there is
# exactly one canonical address. Two hostnames serving identical content splits
# search-engine ranking and doubles the surface you have to reason about.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vvu.edu.gh;

    # The certificate covers both names, so the same files are used here.
    ssl_certificate     /etc/letsencrypt/live/vvu.edu.gh/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vvu.edu.gh/privkey.pem;     # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                      # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                        # managed by Certbot

    return 301 https://vvu.edu.gh$request_uri;
}


# ── HTTP → HTTPS ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vvu.edu.gh www.vvu.edu.gh;

    # Keep the challenge path reachable on plain HTTP so `certbot renew`
    # continues to work unattended every 60 days.
    location ^~ /.well-known/acme-challenge/ {
        root /home/valley_view_uni;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://vvu.edu.gh$request_uri;
    }
}


# ═══════════════════════════════════════════════════════════════════════════
# Decommissioning alpha.vvu.edu.gh
#
# There is no server block for it here, so once this file is live, requests to
# alpha.vvu.edu.gh fall through to whichever server block nginx treats as the
# default — probably /etc/nginx/sites-enabled/default. That is untidy rather
# than dangerous, but finish the job properly:
#
#   1. Remove the DNS record for alpha.vvu.edu.gh at your DNS provider.
#      Until you do, the name still resolves to this server.
#
#   2. Delete the now-unused certificate so `certbot renew` stops trying to
#      renew it and emailing you about failures:
#
#        certbot delete --cert-name alpha.vvu.edu.gh
#
#   3. If you would rather alpha said something explicit than fell through to
#      the default site, add this block back:
#
#        server {
#            listen 443 ssl;
#            server_name alpha.vvu.edu.gh;
#            ssl_certificate     /etc/letsencrypt/live/alpha.vvu.edu.gh/fullchain.pem;
#            ssl_certificate_key /etc/letsencrypt/live/alpha.vvu.edu.gh/privkey.pem;
#            return 410;   # "Gone" — tells search engines to drop it
#        }
#
#      Note this contradicts step 2: keeping the block means keeping the
#      certificate. Choose one.
# ═══════════════════════════════════════════════════════════════════════════
