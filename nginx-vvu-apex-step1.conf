# ═══════════════════════════════════════════════════════════════════════════
# vvu.edu.gh — STEP 1 OF 2: temporary config, used only to obtain the
# TLS certificate. Replace it with nginx-vvu-apex.conf immediately afterwards.
#
# Why two steps: an nginx server block that references
# /etc/letsencrypt/live/vvu.edu.gh/fullchain.pem will not start until that file
# exists, and the file does not exist until Certbot has validated the domain —
# which it does over plain HTTP on port 80. Trying to do it in one step gives
# you an nginx that refuses to start, on the machine currently serving your
# university's main website.
#
# This file therefore listens on port 80 ONLY, serves the ACME challenge, and
# answers everything else with 404. It never touches port 443, so the running
# site is untouched while you request the certificate.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name vvu.edu.gh www.vvu.edu.gh;

    root /home/valley_view_uni;

    # Certbot writes its proof-of-ownership file under this path and then
    # fetches it over HTTP. It must be readable by anyone, including before
    # any certificate exists.
    location ^~ /.well-known/acme-challenge/ {
        root /home/valley_view_uni;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    # Nothing else is served from this temporary block.
    location / {
        return 404;
    }
}
